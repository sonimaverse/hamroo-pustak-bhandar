$kind: http-request
name: 'Get Application by ID (Admin)'
method: GET
url: '{{baseUrl}}/wholesale/{{wholesaleAppId}}'
order: 7000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has application", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("application");
      });
