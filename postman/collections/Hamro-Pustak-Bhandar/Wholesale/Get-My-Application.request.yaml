$kind: http-request
name: Get My Application
method: GET
url: '{{baseUrl}}/wholesale/my-application'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has application", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("application");
      });
      pm.test("Application has status field", function () {
        var json = pm.response.json();
        pm.expect(json.data.application).to.have.property("status");
        pm.expect(["pending","approved","rejected"]).to.include(json.data.application.status);
      });
