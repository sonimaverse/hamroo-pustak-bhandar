$kind: http-request
name: Get Single Product
method: GET
url: '{{baseUrl}}/products/{{productId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has product object", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("product");
      });
      pm.test("Product has correct ID", function () {
        var json = pm.response.json();
        pm.expect(json.data.product._id).to.equal(pm.environment.get("productId"));
      });
      pm.test("Product has name and category", function () {
        var json = pm.response.json();
        pm.expect(json.data.product).to.have.property("name");
        pm.expect(json.data.product).to.have.property("category");
        pm.expect(json.data.product).to.have.property("retailPrice");
      });
