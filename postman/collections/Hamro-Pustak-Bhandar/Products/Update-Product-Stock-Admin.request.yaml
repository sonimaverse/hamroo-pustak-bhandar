$kind: http-request
name: 'Update Product Stock (Admin)'
method: PATCH
url: '{{baseUrl}}/products/{{productId}}/stock'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "stockQuantity": 75
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Stock is updated to 75", function () {
        var json = pm.response.json();
        pm.expect(json.data.product.stockQuantity).to.equal(75);
      });
