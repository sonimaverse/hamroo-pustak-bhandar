$kind: http-request
name: 'Get All Products (Public)'
method: GET
url: '{{baseUrl}}/products'
order: 2000
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has products array", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("products");
        pm.expect(json.data.products).to.be.an("array");
      });
      pm.test("Response has pagination object", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("pagination");
        pm.expect(json.data.pagination).to.have.property("currentPage");
        pm.expect(json.data.pagination).to.have.property("totalPages");
        pm.expect(json.data.pagination).to.have.property("totalItems");
      });
      pm.test("Guest user does not see wholesalePrice", function () {
        var json = pm.response.json();
        if (json.data.products.length > 0) {
          pm.expect(json.data.products[0]).to.not.have.property("wholesalePrice");
        }
      });
      var json = pm.response.json();
      if (json.data && json.data.products && json.data.products.length > 0) {
        pm.environment.set("productId", json.data.products[0]._id);
      }
