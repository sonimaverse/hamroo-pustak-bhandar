$kind: http-request
name: Login User
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "customer@test.com",
      "password": "Test@1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has accessToken", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("accessToken");
      });
      pm.test("Response has user with role", function () {
        var json = pm.response.json();
        pm.expect(json.data.user).to.have.property("role");
        pm.expect(json.data.user).to.not.have.property("password");
      });
      pm.test("refreshToken cookie is set", function () {
        pm.expect(pm.cookies.has("refreshToken")).to.be.true;
      });
      var json = pm.response.json();
      if (json.data && json.data.accessToken) {
        pm.environment.set("accessToken", json.data.accessToken);
        pm.environment.set("userId", json.data.user._id);
        console.log("User accessToken saved");
      }
