$kind: http-request
name: Register User
method: POST
url: '{{baseUrl}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Test Customer",
      "email": "customer@test.com",
      "phone": "+9779800000001",
      "password": "Test@1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has accessToken", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("accessToken");
      });
      pm.test("Response has user object", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("user");
        pm.expect(json.data.user).to.have.property("_id");
        pm.expect(json.data.user).to.have.property("email");
        pm.expect(json.data.user).to.not.have.property("password");
      });
      var json = pm.response.json();
      if (json.data && json.data.accessToken) {
        pm.environment.set("accessToken", json.data.accessToken);
        pm.environment.set("userId", json.data.user._id);
        console.log("accessToken saved:", json.data.accessToken.substring(0, 20) + "...");
      }
