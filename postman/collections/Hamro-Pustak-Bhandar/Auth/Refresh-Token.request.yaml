$kind: http-request
name: Refresh Token
method: POST
url: '{{baseUrl}}/auth/refresh'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has new accessToken", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("accessToken");
        pm.expect(json.data.accessToken).to.be.a("string");
      });
      pm.test("New refreshToken cookie is set", function () {
        pm.expect(pm.cookies.has("refreshToken")).to.be.true;
      });
      var json = pm.response.json();
      if (json.data && json.data.accessToken) {
        pm.environment.set("accessToken", json.data.accessToken);
        console.log("accessToken refreshed");
      }
