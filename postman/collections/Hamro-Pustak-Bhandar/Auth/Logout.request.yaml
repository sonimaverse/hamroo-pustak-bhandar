$kind: http-request
name: Logout
method: POST
url: '{{baseUrl}}/auth/logout'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Logout message is correct", function () {
        var json = pm.response.json();
        pm.expect(json.message).to.include("Logout");
      });
      pm.environment.unset("accessToken");
      console.log("accessToken cleared from environment");
