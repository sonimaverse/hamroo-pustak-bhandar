$kind: http-request
name: User Stats
method: GET
url: '{{baseUrl}}/dashboard/users/stats'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response success is true", function () {
        var json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has user stats", function () {
        var json = pm.response.json();
        pm.expect(json.data).to.have.property("customers");
        pm.expect(json.data).to.have.property("wholesaleUsers");
        pm.expect(json.data).to.have.property("pendingApprovals");
      });
